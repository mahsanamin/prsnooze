# Code scanning: looks for vulnerabilities in the PR's own JavaScript, which the
# dependency audit in ci.yml can't see. Findings appear inline on the PR.
#
# Relevant here because this app takes a URL from anyone who can reach the page,
# shells out to git/gh/claude with it, and renders remote strings (PR titles,
# review text) into the DOM — command construction and HTML sinks are exactly
# what the security-extended queries look for.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Queries improve over time; a weekly run re-checks code nobody has touched.
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload the results
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Adds the queries that matter for this codebase (injection, unsafe
          # deserialization, XSS) on top of the default set.
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
