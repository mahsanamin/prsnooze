# Tests and a dependency-vulnerability gate on every pull request.
#
# The `audit` job is the thing that actually refuses a PR carrying a vulnerable
# dependency — Dependabot only opens PRs against this repo's own deps, it never
# inspects an incoming one. Make this check required in branch protection for it
# to block a merge rather than just report.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares node >=20, so prove both the floor and current.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `npm ci` installs exactly the lockfile — a PR that edits package.json
      # without regenerating the lock fails here, which is the intent.
      - run: npm ci
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      # npm 10 can fall back to the retiring Quick Audit endpoint when the
      # registry rejects a Bulk Advisory request. Keep this job on a client
      # that uses the supported endpoint instead of inheriting Node's npm.
      - name: use the pinned audit client
        run: npm install --global npm@11.6.2
      - run: npm ci --no-audit
      - run: npm ci --prefix docker/providers --no-audit
      # Fails the PR on a moderate-or-worse advisory in the resolved tree. Set
      # to `high` if moderate turns out to be too noisy for this repo — but
      # prefer fixing or, when a fix genuinely doesn't exist yet, recording the
      # exception here in the diff where a reviewer can see it.
      - name: npm audit (moderate and above)
        run: |
          audit_tree() {
            tree="$1"
            shift
            for attempt in 1 2; do
              if npm audit --audit-level=moderate "$@"; then
                return 0
              fi
              if [ "$attempt" -eq 2 ]; then
                return 1
              fi
              echo "$tree audit failed; retrying once after a registry cooldown"
              sleep 5
            done
          }
          audit_tree application
          audit_tree provider-clis --prefix docker/providers
      # Verifies the registry signatures on what was installed, which catches a
      # tampered or unsigned package that `audit` alone would not.
      - name: verify package signatures
        run: |
          npm audit signatures
          npm audit signatures --prefix docker/providers
