  <!-- Ears -->
  <polygon points="408,338 408,288 442,328" fill="#f97316"/>
  <polygon points="492,338 492,288 458,328" fill="#f97316"/>
  <polygon points="416,335 416,308 432,328" fill="#fda4af"/>
  <polygon points="484,335 484,308 468,328" fill="#fda4af"/>
  <!-- Closed sleeping eye -->
  <path d="M 425 380 Q 437 388, 449 380" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round"/>
