      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#catBg)"/>
  <g fill="#fef3c7">
